# Demo videos. Files live in /videos/ as <file>.mp4 and <file>-poster.jpg.
demos:
  - id: sleuthvlm
    name: SleuthVLM
    file: sleuthvlm-demo
    venue: Preprint · 2026
    title: "Do We Really Need Audio-in-Video for Omni Video Understanding?"
    text: "A VLM that never hears the audio directly. Speech becomes a word-timed transcript, and the model sleuths the video with a few tools until the evidence decides."
    caption: "Two LVOmniBench questions on 36- and 59-minute videos, replayed from logged trajectories."
    stats:
      - value: "75.0%"
        label: best average on four omni benchmarks
      - value: "77.8%"
        label: top of the Video-MME-v2 leaderboard
    links:
      - label: Project
        url: https://wpr001.github.io/sleuthVLM/
      - label: Paper
        url: https://arxiv.org/abs/2611.06083
      - label: Code
        url: https://github.com/WPR001/OpenOmniHarness
  - id: marc
    name: MARC
    file: marc-demo
    venue: ICLR 2026
    title: "Memory-Augmented RL Token Compression for Efficient Video Understanding"
    text: "Retrieve, then compress. MARC keeps near-baseline accuracy with the visual tokens of a single frame, so answers arrive sooner."
    caption: "MARC and Qwen2.5-VL-3B answering the same questions side by side."
    stats:
      - value: "95%"
        label: fewer visual tokens
      - value: "72%"
        label: less GPU memory
    links:
      - label: Project
        url: https://yunzeliu.github.io/MARC/
      - label: Paper
        url: https://arxiv.org/abs/2510.07915
      - label: Code
        url: https://github.com/WPR001/Omni_marc
